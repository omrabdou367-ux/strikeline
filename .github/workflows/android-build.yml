name: Build Strikeline APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd packaging/android/apk || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload Strikeline APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strikeline-APK
          path: |
            packaging/android/apk/build/outputs/apk/debug/*.apk
            **/*.apk
