name: Build Strikeline APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "packaging/android/apk/gradlew" ]; then
            chmod +x packaging/android/apk/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build APK with Gradle
        run: |
          cd packaging/android/apk || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Upload Strikeline APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Strikeline-APK
          path: packaging/android/apk/build/outputs/apk/debug/*.apk
