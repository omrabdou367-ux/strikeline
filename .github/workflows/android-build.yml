name: Build Strikeline APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd packaging/android/apk || true
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            find . -name "gradlew" -exec chmod +x {} \; -exec {} assembleDebug \;
          fi

      - name: Upload Strikeline APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strikeline-APK
          path: |
            packaging/android/apk/build/outputs/apk/debug/*.apk
            **/*.apk
